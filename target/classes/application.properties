spring.application.name=propi-backend
server.port=8080
server.servlet.context-path=/api/v1

# ─── Conexión principal (SQL Server) ──────────────────────────────────────────
# Correcta sintaxis JDBC para SQL Server
spring.datasource.url=jdbc:sqlserver://DSVPC:1433;databaseName=PropiDB;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Credenciales del pool base de Spring Boot 
